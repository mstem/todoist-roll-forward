name: Roll Forward Tasks

on:
  schedule:
    - cron: '2 0 * * *'   # 00:02 UTC — safely after midnight in the Todoist account zone
                          # (Europe/Rome, UTC+1/+2). GitHub may delay scheduled runs ~1h,
                          # which is now harmless: the script anchors "today" to the
                          # account timezone fetched from the Todoist API.
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  roll-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run roll-forward
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
        run: python3 rollforward.py
